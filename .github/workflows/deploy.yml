name: Deploy to GitHub Pages

on:
  push: # push trigger
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Main App
        env:
          VITE_BASE_PATH: /
        run: pnpm run build:after

      - name: Build Storybook
        env:
          STORYBOOK_BASE_PATH: /storybook/
        working-directory: packages/after
        run: |
          echo "Starting Storybook build..."
          echo "Current directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"

          # Run build and capture output
          set +e
          pnpm run build-storybook > /tmp/storybook-build.log 2>&1
          BUILD_EXIT_CODE=$?
          set -e

          # Always show the log
          echo "=== Storybook Build Log ==="
          cat /tmp/storybook-build.log
          echo "=== End of Build Log ==="
          echo ""
          echo "Build exit code: $BUILD_EXIT_CODE"

          # Check if storybook-static was created
          if [ -d "storybook-static" ]; then
            echo "✓ storybook-static directory found"
            ls -la storybook-static | head -10
          else
            echo "✗ storybook-static directory NOT found"
            echo "Current directory contents:"
            ls -la
            echo ""
            echo "Checking parent directory:"
            ls -la .. | grep -E "storybook|after" || echo "No storybook directories in parent"
          fi

          # Exit with error if build failed or directory not found
          if [ $BUILD_EXIT_CODE -ne 0 ] || [ ! -d "storybook-static" ]; then
            echo ""
            echo "Storybook build failed or output directory not found"
            exit 1
          fi

      - name: Verify Storybook build
        run: |
          if [ ! -d "packages/after/storybook-static" ]; then
            echo "Error: storybook-static directory not found after build"
            echo "Checking packages/after directory:"
            ls -la packages/after/ | head -20
            echo "Checking for any storybook-related files:"
            find packages/after -name "*storybook*" -type d 2>/dev/null || echo "No storybook directories found"
            exit 1
          fi
          echo "Storybook build verified: $(du -sh packages/after/storybook-static | cut -f1)"

      - name: Prepare deployment
        run: |
          cp packages/after/dist/index.html packages/after/dist/404.html
          mkdir -p packages/after/dist/storybook
          cp -r packages/after/storybook-static/* packages/after/dist/storybook/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./packages/after/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
